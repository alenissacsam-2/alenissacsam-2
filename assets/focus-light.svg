<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 306" width="1000" height="306" role="img" aria-label="Current focus">
<defs>
  <clipPath id="clip"><rect x="1" y="1" width="998" height="304" rx="13"/></clipPath>
  <linearGradient id="sweepg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
    <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.13"/>
    <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0H0V26" fill="none" stroke="#EAEEF2" stroke-width="1"/>
  </pattern>
</defs>
<style>
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .s { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif; }
  text { text-rendering: geometricPrecision; }
  @keyframes rise { 0% { opacity:0; transform:translateY(8px) } 100% { opacity:1; transform:translateY(0) } }
  @keyframes grow { 0% { transform:scaleX(0) } 100% { transform:scaleX(1) } }
  @keyframes glide { 0% { transform:translateX(-200px) } 100% { transform:translateX(1000px) } }
  .r { opacity:0; animation: rise .7s ease-out forwards; }
  .g { transform-origin:left center; animation: grow 1.1s cubic-bezier(.25,.9,.3,1) forwards; transform:scaleX(0); }
  .sweep { animation: glide 8s cubic-bezier(.4,0,.6,1) infinite; }

  /* Resolve to the finished state, not frame zero - otherwise every
     faded-in row would sit at opacity 0 and the card would look empty. */
  @media (prefers-reduced-motion: reduce) {
    .r { opacity:1; transform:none; animation:none; }
    .g { transform:scaleX(1); animation:none; }
    .sweep { opacity:0; animation:none; }
  }
</style>
<rect x="1" y="1" width="998" height="304" rx="13" fill="#FFFFFF" stroke="#D5DCE3" stroke-width="1.5"/>
<g clip-path="url(#clip)">
  <rect x="1" y="1" width="998" height="3" fill="#6D28D9"/>
  <rect x="34" y="31" width="3.5" height="18" rx="1.75" fill="#6D28D9"/>
  <text class="s" x="48" y="46" font-size="15" font-weight="700" letter-spacing="2.6" fill="#1F2328">CURRENT FOCUS</text>
  <text class="m" x="966" y="46" font-size="11.5" text-anchor="end" fill="#98A1AB">4 active tracks</text>
  <line x1="34" y1="64" x2="966" y2="64" stroke="#D5DCE3"/>
</g><g clip-path="url(#clip)">
  <rect x="1" y="65" width="998" height="240" fill="url(#grid)" opacity="0.5"/>
  <g class="r" style="animation-delay:0.10s">
    <rect x="30" y="82" width="452" height="96" rx="10" fill="#F6F8FA" stroke="#D5DCE3"/>
    <rect x="30" y="96" width="3" height="68" rx="1.5" fill="#0E7490"/>
    <text class="m" x="52" y="109" font-size="9.5" letter-spacing="1.9" fill="#0E7490">IDENTITY</text>
    <text class="s" x="52" y="133" font-size="16.5" font-weight="700" fill="#1F2328">DID + verifiable credentials</text>
    <text class="m" x="52" y="152" font-size="11" fill="#59636E">Issuance and verification flows running across both Ethereum</text>
    <text class="m" x="52" y="167" font-size="11" fill="#59636E">and Algorand.</text>
  </g>
  <g class="r" style="animation-delay:0.18s">
    <rect x="518" y="82" width="452" height="96" rx="10" fill="#F6F8FA" stroke="#D5DCE3"/>
    <rect x="518" y="96" width="3" height="68" rx="1.5" fill="#6D28D9"/>
    <text class="m" x="540" y="109" font-size="9.5" letter-spacing="1.9" fill="#6D28D9">AGENTS</text>
    <text class="s" x="540" y="133" font-size="16.5" font-weight="700" fill="#1F2328">Multi-agent systems</text>
    <text class="m" x="540" y="152" font-size="11" fill="#59636E">Orchestration and tool use built on Google's Agent</text>
    <text class="m" x="540" y="167" font-size="11" fill="#59636E">Development Kit.</text>
  </g>
  <g class="r" style="animation-delay:0.26s">
    <rect x="30" y="194" width="452" height="96" rx="10" fill="#F6F8FA" stroke="#D5DCE3"/>
    <rect x="30" y="208" width="3" height="68" rx="1.5" fill="#047857"/>
    <text class="m" x="52" y="221" font-size="9.5" letter-spacing="1.9" fill="#047857">MARKETS</text>
    <text class="s" x="52" y="245" font-size="16.5" font-weight="700" fill="#1F2328">Prediction markets &amp; order flow</text>
    <text class="m" x="52" y="264" font-size="11" fill="#59636E">Real-time microstructure analysis for on-chain event trading.</text>
  </g>
  <g class="r" style="animation-delay:0.34s">
    <rect x="518" y="194" width="452" height="96" rx="10" fill="#F6F8FA" stroke="#D5DCE3"/>
    <rect x="518" y="208" width="3" height="68" rx="1.5" fill="#B45309"/>
    <text class="m" x="540" y="221" font-size="9.5" letter-spacing="1.9" fill="#B45309">FOUNDATIONS</text>
    <text class="s" x="540" y="245" font-size="16.5" font-weight="700" fill="#1F2328">Neural nets from scratch</text>
    <text class="m" x="540" y="264" font-size="11" fill="#59636E">Backprop derived by hand. No frameworks - just NumPy and</text>
    <text class="m" x="540" y="279" font-size="11" fill="#59636E">pain.</text>
  </g>
  <rect class="sweep" x="0" y="65" width="200" height="240" fill="url(#sweepg)"/>
</g>
</svg>
