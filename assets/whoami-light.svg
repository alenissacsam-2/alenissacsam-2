<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 348" width="1000" height="348" role="img" aria-label="whoami">
<defs>
  <clipPath id="clip"><rect x="1" y="1" width="998" height="346" rx="13"/></clipPath>
  <linearGradient id="sweepg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
    <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.13"/>
    <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0H0V26" fill="none" stroke="#EAEEF2" stroke-width="1"/>
  </pattern>
</defs>
<style>
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .s { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif; }
  text { text-rendering: geometricPrecision; }
  @keyframes rise { 0% { opacity:0; transform:translateY(8px) } 100% { opacity:1; transform:translateY(0) } }
  @keyframes grow { 0% { transform:scaleX(0) } 100% { transform:scaleX(1) } }
  @keyframes glide { 0% { transform:translateX(-200px) } 100% { transform:translateX(1000px) } }
  .r { opacity:0; animation: rise .7s ease-out forwards; }
  .g { transform-origin:left center; animation: grow 1.1s cubic-bezier(.25,.9,.3,1) forwards; transform:scaleX(0); }
  .sweep { animation: glide 8s cubic-bezier(.4,0,.6,1) infinite; }

  /* Resolve to the finished state, not frame zero - otherwise every
     faded-in row would sit at opacity 0 and the card would look empty. */
  @media (prefers-reduced-motion: reduce) {
    .r { opacity:1; transform:none; animation:none; }
    .g { transform:scaleX(1); animation:none; }
    .sweep { opacity:0; animation:none; }
  }
</style>
<rect x="1" y="1" width="998" height="346" rx="13" fill="#FFFFFF" stroke="#D5DCE3" stroke-width="1.5"/>
<g clip-path="url(#clip)">
  <rect x="1" y="1" width="998" height="3" fill="#0E7490"/>
  <rect x="34" y="31" width="3.5" height="18" rx="1.75" fill="#0E7490"/>
  <text class="s" x="48" y="46" font-size="15" font-weight="700" letter-spacing="2.6" fill="#1F2328">WHOAMI</text>
  <text class="m" x="966" y="46" font-size="11.5" text-anchor="end" fill="#98A1AB">identity object</text>
  <line x1="34" y1="64" x2="966" y2="64" stroke="#D5DCE3"/>
</g><g clip-path="url(#clip)">
  <rect x="1" y="65" width="998" height="282" fill="url(#grid)" opacity="0.5"/>
  <rect x="30" y="82" width="620" height="234" rx="10" fill="#F6F8FA" stroke="#D5DCE3"/>
  <g class="r" style="animation-delay:0.10s">
    <text class="m" x="62" y="108.0" font-size="12.0" text-anchor="end" fill="#98A1AB">1</text>
    <text class="m" x="78" y="108.0" font-size="12.0"><tspan fill="#7C3AED">const</tspan><tspan fill="#1F2328">&#160;alen</tspan><tspan fill="#8C959F">&#160;=&#160;{</tspan></text>
  </g>
  <g class="r" style="animation-delay:0.15s">
    <text class="m" x="62" y="130.0" font-size="12.0" text-anchor="end" fill="#98A1AB">2</text>
    <text class="m" x="78" y="130.0" font-size="12.0"><tspan fill="#0369A1">&#160;&#160;location</tspan><tspan fill="#8C959F">:&#160;&#160;&#160;</tspan><tspan fill="#047857">&quot;Kerala,&#160;India&quot;</tspan><tspan fill="#8C959F">,</tspan></text>
  </g>
  <g class="r" style="animation-delay:0.19s">
    <text class="m" x="62" y="152.0" font-size="12.0" text-anchor="end" fill="#98A1AB">3</text>
    <text class="m" x="78" y="152.0" font-size="12.0"><tspan fill="#0369A1">&#160;&#160;school</tspan><tspan fill="#8C959F">:&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#047857">&quot;IIT&#160;Hyderabad&quot;</tspan><tspan fill="#8C959F">,</tspan></text>
  </g>
  <g class="r" style="animation-delay:0.24s">
    <text class="m" x="62" y="174.0" font-size="12.0" text-anchor="end" fill="#98A1AB">4</text>
    <text class="m" x="78" y="174.0" font-size="12.0"><tspan fill="#0369A1">&#160;&#160;focus</tspan><tspan fill="#8C959F">:&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#047857">&quot;Decentralized&#160;identity&#160;&amp;&#160;verifiable&#160;credentials&quot;</tspan><tspan fill="#8C959F">,</tspan></text>
  </g>
  <g class="r" style="animation-delay:0.28s">
    <text class="m" x="62" y="196.0" font-size="12.0" text-anchor="end" fill="#98A1AB">5</text>
    <text class="m" x="78" y="196.0" font-size="12.0"><tspan fill="#0369A1">&#160;&#160;chains</tspan><tspan fill="#8C959F">:&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#8C959F">[</tspan><tspan fill="#047857">&quot;Ethereum&quot;</tspan><tspan fill="#8C959F">,&#160;</tspan><tspan fill="#047857">&quot;Algorand&quot;</tspan><tspan fill="#8C959F">],</tspan></text>
  </g>
  <g class="r" style="animation-delay:0.32s">
    <text class="m" x="62" y="218.0" font-size="12.0" text-anchor="end" fill="#98A1AB">6</text>
    <text class="m" x="78" y="218.0" font-size="12.0"><tspan fill="#0369A1">&#160;&#160;stack</tspan><tspan fill="#8C959F">:&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#8C959F">[</tspan><tspan fill="#047857">&quot;Solidity&quot;</tspan><tspan fill="#8C959F">,&#160;</tspan><tspan fill="#047857">&quot;PyTeal&quot;</tspan><tspan fill="#8C959F">,&#160;</tspan><tspan fill="#047857">&quot;TypeScript&quot;</tspan><tspan fill="#8C959F">,&#160;</tspan><tspan fill="#047857">&quot;Python&quot;</tspan><tspan fill="#8C959F">],</tspan></text>
  </g>
  <g class="r" style="animation-delay:0.37s">
    <text class="m" x="62" y="240.0" font-size="12.0" text-anchor="end" fill="#98A1AB">7</text>
    <text class="m" x="78" y="240.0" font-size="12.0"><tspan fill="#0369A1">&#160;&#160;alsoInto</tspan><tspan fill="#8C959F">:&#160;&#160;&#160;</tspan><tspan fill="#8C959F">[</tspan><tspan fill="#047857">&quot;AI&#160;agents&quot;</tspan><tspan fill="#8C959F">,&#160;</tspan><tspan fill="#047857">&quot;market&#160;microstructure&quot;</tspan><tspan fill="#8C959F">,&#160;</tspan><tspan fill="#047857">&quot;geospatial&#160;analysis&quot;</tspan><tspan fill="#8C959F">],</tspan></text>
  </g>
  <g class="r" style="animation-delay:0.42s">
    <text class="m" x="62" y="262.0" font-size="12.0" text-anchor="end" fill="#98A1AB">8</text>
    <text class="m" x="78" y="262.0" font-size="12.0"><tspan fill="#0369A1">&#160;&#160;philosophy</tspan><tspan fill="#8C959F">:&#160;</tspan><tspan fill="#047857">&quot;Trust&#160;should&#160;be&#160;verifiable,&#160;not&#160;assumed.&quot;</tspan><tspan fill="#8C959F">,</tspan></text>
  </g>
  <g class="r" style="animation-delay:0.46s">
    <text class="m" x="62" y="284.0" font-size="12.0" text-anchor="end" fill="#98A1AB">9</text>
    <text class="m" x="78" y="284.0" font-size="12.0"><tspan fill="#8C959F">};</tspan></text>
  </g>
  <rect x="670" y="82" width="300" height="234" rx="10" fill="#F6F8FA" stroke="#D5DCE3"/>
  <g class="r" style="animation-delay:.24s">
    <text class="m" x="690" y="110" font-size="9.5" letter-spacing="1.9" fill="#0E7490">BRIEF</text>
    <text class="m" x="690" y="134" font-size="11" fill="#59636E">I build systems where identity and</text>
    <text class="m" x="690" y="150" font-size="11" fill="#59636E">credentials live on-chain, so a</text>
    <text class="m" x="690" y="166" font-size="11" fill="#59636E">certificate, a degree, or a KYC check</text>
    <text class="m" x="690" y="182" font-size="11" fill="#59636E">can be verified by anyone, without</text>
    <text class="m" x="690" y="198" font-size="11" fill="#59636E">phoning a central authority.</text>
  </g>
  <line x1="690" y1="236" x2="950" y2="236" stroke="#D5DCE3"/>
  <g class="r" style="animation-delay:0.34s">
    <circle cx="694" cy="256" r="3.5" fill="#0E7490"/>
    <text class="m" x="706" y="260" font-size="11" fill="#1F2328">3 identity projects</text>
    <text class="m" x="950" y="260" font-size="10" text-anchor="end" fill="#98A1AB">Ethereum + Algorand</text>
  </g>
  <g class="r" style="animation-delay:0.40s">
    <circle cx="694" cy="280" r="3.5" fill="#6D28D9"/>
    <text class="m" x="706" y="284" font-size="11" fill="#1F2328">AI agents</text>
    <text class="m" x="950" y="284" font-size="10" text-anchor="end" fill="#98A1AB">Google ADK, multi-agent</text>
  </g>
  <g class="r" style="animation-delay:0.46s">
    <circle cx="694" cy="304" r="3.5" fill="#047857"/>
    <text class="m" x="706" y="308" font-size="11" fill="#1F2328">Neural nets</text>
    <text class="m" x="950" y="308" font-size="10" text-anchor="end" fill="#98A1AB">from first principles</text>
  </g>
  <rect class="sweep" x="0" y="65" width="200" height="282" fill="url(#sweepg)"/>
</g>
</svg>
