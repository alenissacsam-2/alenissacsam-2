name: Build and sign the passport

on:
  schedule:
    - cron: "17 4 * * *"   # daily, off the hour
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/scripts/**"
      - ".github/workflows/cards.yml"
      - "assets/fonts/**"

# Shared with stamp.yml so two runs never push at once.
concurrency:
  group: profile-write
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write      # Sigstore keyless signing
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools==4.60.1 pillow==11.3.0

      - name: Render passport, visas, log, registry and seal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/build.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/generated
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore(passport): rebuild [skip ci]"
            git push
          fi

      # The passport's document number is this file's SHA-256; this signs it.
      - name: Sign README
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: README.md
