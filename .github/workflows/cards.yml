name: Rebuild profile cards

on:
  schedule:
    # Daily at 04:17 UTC. Off-the-hour so it isn't queued behind the crowd.
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/build_cards.py"
      - ".github/workflows/cards.yml"

# Never let a scheduled run and a manual run push at the same time.
concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/build_cards.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          if git diff --staged --quiet; then
            echo "cards unchanged - nothing to commit"
            exit 0
          fi
          git commit -m "chore(cards): refresh profile telemetry [skip ci]"
          git push
